<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity 上下文监控与压缩线指示器</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --accent: #38bdf8;
    }
    @keyframes pulse-slow {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }
    .pulsing-dot {
      animation: pulse-slow 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-transparent text-[var(--foreground,#f8fafc)] antialiased p-4 select-none font-sans">
  <div class="max-w-md mx-auto bg-[var(--card,#1e293b)] border border-[var(--border,#334155)] rounded-2xl p-5 shadow-2xl backdrop-blur-md">
    
    <!-- Header -->
    <div class="flex items-center justify-between pb-3 border-b border-[var(--border,#334155)]">
      <div class="flex items-center space-x-2">
        <div class="w-3 h-3 rounded-full bg-emerald-500 pulsing-dot" id="live-indicator"></div>
        <span class="font-bold text-sm tracking-wide text-[var(--foreground,#f8fafc)]">上下文实时监视面板</span>
      </div>
      <div class="flex items-center space-x-1.5">
        <span class="text-xs px-2 py-0.5 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20 font-mono" id="model-badge">检测中...</span>
      </div>
    </div>

    <!-- Main Gauge & Usage Ratio -->
    <div class="my-5 text-center">
      <div class="flex items-baseline justify-center space-x-1">
        <span class="text-4xl font-extrabold tracking-tight text-[var(--foreground,#f8fafc)] font-mono" id="usage-pct">0.0</span>
        <span class="text-xl font-bold text-[var(--muted-foreground,#94a3b8)]">%</span>
      </div>
      <p class="text-xs text-[var(--muted-foreground,#94a3b8)] mt-1 font-medium" id="status-tag">🟢 充裕健康 (Optimal)</p>

      <!-- Progress Track with Compaction Threshold Marker -->
      <div class="relative w-full h-4 bg-slate-800/80 rounded-full mt-4 overflow-hidden border border-[var(--border,#334155)]">
        <!-- Compaction 80% Threshold Guide Marker -->
        <div class="absolute top-0 bottom-0 left-[80%] w-0.5 bg-rose-500 z-10 shadow-[0_0_8px_rgba(244,63,94,0.8)]" title="80% 推荐压缩线"></div>
        <!-- Progress Fill Bar -->
        <div class="h-full bg-gradient-to-r from-emerald-500 via-sky-500 to-amber-500 transition-all duration-700 rounded-full" id="progress-bar" style="width: 0%;"></div>
      </div>
      
      <!-- Threshold Labels Under Bar -->
      <div class="flex justify-between text-[11px] font-mono text-[var(--muted-foreground,#94a3b8)] mt-1.5 px-0.5">
        <span>0</span>
        <span class="text-amber-400 font-semibold" title="预警线">75% 警戒</span>
        <span class="text-rose-400 font-bold" title="压缩线">80% 压缩线</span>
        <span id="max-scale">1.0M</span>
      </div>
    </div>

    <!-- Detailed Stats Grid -->
    <div class="grid grid-cols-2 gap-2 text-xs my-4">
      <div class="bg-slate-900/40 p-2.5 rounded-xl border border-[var(--border,#334155)]">
        <div class="text-[var(--muted-foreground,#94a3b8)] text-[11px]">当前上下文 (Tokens)</div>
        <div class="text-sm font-bold font-mono text-[var(--foreground,#f8fafc)] mt-0.5" id="current-tokens">-</div>
      </div>
      <div class="bg-slate-900/40 p-2.5 rounded-xl border border-[var(--border,#334155)]">
        <div class="text-[var(--muted-foreground,#94a3b8)] text-[11px]">模型上限 (Tokens)</div>
        <div class="text-sm font-bold font-mono text-[var(--foreground,#f8fafc)] mt-0.5" id="max-tokens">-</div>
      </div>
      <div class="bg-slate-900/40 p-2.5 rounded-xl border border-[var(--border,#334155)]">
        <div class="text-[var(--muted-foreground,#94a3b8)] text-[11px]">其中缓存命中</div>
        <div class="text-sm font-bold font-mono text-sky-400 mt-0.5" id="cache-tokens">-</div>
      </div>
      <div class="bg-slate-900/40 p-2.5 rounded-xl border border-[var(--border,#334155)]">
        <div class="text-[var(--muted-foreground,#94a3b8)] text-[11px]">距离压缩线 (80%)</div>
        <div class="text-sm font-bold font-mono text-emerald-400 mt-0.5" id="rem-compaction">-</div>
      </div>
    </div>

    <!-- Action Section -->
    <div class="mt-4 pt-3 border-t border-[var(--border,#334155)] flex items-center justify-between">
      <div class="text-[11px] text-[var(--muted-foreground,#94a3b8)] flex items-center space-x-1">
        <span>🔄 自动刷新</span>
        <span id="last-update" class="text-[10px] opacity-75 font-mono"></span>
      </div>
      <button onclick="copyCompact()" class="px-2.5 py-1 text-xs font-semibold bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg transition-colors border border-slate-600">
        复制 /compact
      </button>
    </div>

    <!-- Artifacts On-Demand Sync -->
    <div class="mt-3 pt-3 border-t border-[var(--border,#334155)] flex items-center justify-between space-x-2">
      <button onclick="syncCurrent()" id="btn-sync-cur" class="flex-1 py-1.5 px-2 text-xs font-medium bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 rounded-lg border border-emerald-500/30 transition flex items-center justify-center space-x-1">
        <span>⚡ 写入当前工件</span>
      </button>
      <button onclick="syncAll()" id="btn-sync-all" class="flex-1 py-1.5 px-2 text-xs font-medium bg-sky-600/20 hover:bg-sky-600/30 text-sky-300 rounded-lg border border-sky-500/30 transition flex items-center justify-center space-x-1">
        <span>🔄 同步全部会话</span>
      </button>
    </div>
    
    <div id="toast" class="hidden text-center text-xs text-emerald-400 font-semibold mt-2.5 bg-slate-900/60 py-1 rounded border border-slate-700/50">
      已更新！
    </div>

  </div>

  <script>
    const API_URL = "/api/status";

    function showToast(text, isError = false) {
      const toast = document.getElementById("toast");
      toast.innerText = text;
      toast.className = isError 
        ? "text-center text-xs text-rose-400 font-semibold mt-2.5 bg-slate-900/60 py-1 rounded border border-rose-700/50"
        : "text-center text-xs text-emerald-400 font-semibold mt-2.5 bg-slate-900/60 py-1 rounded border border-emerald-700/50";
      toast.classList.remove("hidden");
      setTimeout(() => toast.classList.add("hidden"), 3000);
    }

    async function syncCurrent() {
      const btn = document.getElementById("btn-sync-cur");
      btn.innerText = "⏳ 写入中...";
      try {
        const resp = await fetch("/api/sync-current");
        const res = await resp.json();
        if (res.ok) {
          showToast(`✅ 当前工件已写入: ${res.artifact || '完成'}`);
        } else {
          showToast(`❌ 写入失败: ${res.error}`, true);
        }
      } catch (e) {
        showToast("❌ 连接失败", true);
      } finally {
        btn.innerText = "⚡ 写入当前工件";
      }
    }

    async function syncAll() {
      const btn = document.getElementById("btn-sync-all");
      btn.innerText = "⏳ 扫描中...";
      try {
        const resp = await fetch("/api/sync-all");
        const res = await resp.json();
        if (res.ok) {
          showToast(`🎉 已成功同步 ${res.count} 个会话工件！`);
        } else {
          showToast(`❌ 同步失败: ${res.error}`, true);
        }
      } catch (e) {
        showToast("❌ 连接失败", true);
      } finally {
        btn.innerText = "🔄 同步全部会话";
      }
    }

    async function fetchStatus() {
      try {
        const resp = await fetch(API_URL);
        if (!resp.ok) throw new Error("Network response was not ok");
        const data = await resp.json();
        render(data);
      } catch (err) {
        document.getElementById("status-tag").innerText = "⚠️ 正在连接后台监测服务...";
      }
    }

    function render(data) {
      if (data.error) {
        document.getElementById("status-tag").innerText = data.error;
        return;
      }

      const cur = data.current_context_tokens || 0;
      const maxT = data.max_context_tokens || 1048576;
      const pct = (data.usage_percent || 0).toFixed(1);
      const cache = data.cache_read_tokens || 0;
      const rem = data.remaining_to_compaction || 0;
      const model = data.resolved_model || data.model_name || "Active Model";

      document.getElementById("usage-pct").innerText = pct;
      document.getElementById("model-badge").innerText = model.length > 18 ? model.substring(0, 16) + "..." : model;
      document.getElementById("status-tag").innerText = data.status_text || "正常";
      document.getElementById("current-tokens").innerText = cur.toLocaleString();
      document.getElementById("max-tokens").innerText = maxT.toLocaleString();
      document.getElementById("cache-tokens").innerText = cache.toLocaleString();
      
      const remEl = document.getElementById("rem-compaction");
      if (rem > 0) {
        remEl.innerText = `剩余 ${rem.toLocaleString()}`;
        remEl.className = "text-sm font-bold font-mono text-emerald-400 mt-0.5";
      } else {
        remEl.innerText = `超出 ${Math.abs(rem).toLocaleString()}`;
        remEl.className = "text-sm font-bold font-mono text-rose-400 mt-0.5";
      }

      // Progress bar
      const bar = document.getElementById("progress-bar");
      const cappedPct = Math.min(Math.max(parseFloat(pct), 0), 100);
      bar.style.width = cappedPct + "%";
      
      if (cappedPct >= 80) {
        bar.className = "h-full bg-rose-500 shadow-[0_0_12px_rgba(244,63,94,0.7)] transition-all duration-700 rounded-full";
      } else if (cappedPct >= 75) {
        bar.className = "h-full bg-amber-500 shadow-[0_0_10px_rgba(245,158,11,0.6)] transition-all duration-700 rounded-full";
      } else {
        bar.className = "h-full bg-gradient-to-r from-emerald-500 via-sky-500 to-blue-500 transition-all duration-700 rounded-full";
      }

      const now = new Date();
      document.getElementById("last-update").innerText = now.toTimeString().split(" ")[0];
    }

    function copyCompact() {
      navigator.clipboard.writeText("/compact").then(() => {
        const toast = document.getElementById("toast");
        toast.classList.remove("hidden");
        setTimeout(() => toast.classList.add("hidden"), 2000);
      });
    }

    // Auto-fetch every 2 seconds
    fetchStatus();
    setInterval(fetchStatus, 2000);
  </script>
</body>
</html>
